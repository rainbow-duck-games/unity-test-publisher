name: 'Release'
on:
  push:
    branches:
      - main
  workflow_dispatch: { }

jobs:
  release:
    name: 'Tag & Release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 'Resolve version'
        id: version
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 24
          cache: npm

      - name: 'Build & test'
        if: steps.version.outputs.exists == 'false'
        run: |
          npm i
          npm run all

      - name: 'Commit dist'
        id: dist
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898475+github-actions[bot]@users.noreply.github.com'
            git add dist
            git commit -m "Build dist for $TAG"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 'Create release'
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.dist.outputs.sha }}
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
