name: 'Release'
on:
  push:
    branches:
      - main
  workflow_dispatch: { }

# Creates tag + GitHub Release `v<package.json version>` if it does not exist yet.
# To release: bump `version` in package.json, rebuild dist, merge to main.
jobs:
  release:
    name: 'Tag & Release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 'Resolve version'
        id: version
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 24
          cache: npm

      - name: 'Build & test'
        if: steps.version.outputs.exists == 'false'
        run: |
          npm i
          npm run all

      - name: 'Check dist is up to date'
        if: steps.version.outputs.exists == 'false'
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ differs from the build output, run 'npm run package' and commit it"
            git status --porcelain dist
            exit 1
          fi

      - name: 'Create release'
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
